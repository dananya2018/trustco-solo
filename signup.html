<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Trustco - Signup Form</title>
		<link rel="stylesheet" href="./signup.css">
		<!-- font style link -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <!-- fontawesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
		<!-- script file link -->
		 <script src="./script.js"></script>
	</head>
	<body>
    <div class="container">
      <form action="" id="form" class="form">
        <div class="header">
          <h4>REGISTER YOURSELF HERE</h4>
        </div>
        <div class="form-control">
          <label for="name">User Name</label>
          <input type="text" id="username" placeholder="Enter your full name" autocomplete="off" />
          <i class="fa-solid fa-circle-check"></i>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Error message</span>
        </div>
        <div class="form-control">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email id" autocomplete="off"/>
          <i class="fa-solid fa-circle-check"></i>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Error message</span>
        </div>
        <div class="form-control">
          <label for="phone">Phone No</label>
          <input type="number" id="phone" placeholder="Enter your mobile no" autocomplete="off" />
          <i class="fa-solid fa-circle-check"></i>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Error message</span>
        </div>
        <div class="form-control">
          <label for="password">Paswword</label>
          <input type="password" id="paswword" placeholder="Create your pasword" autocomplete="off" />
          <i class="fa-solid fa-circle-check"></i>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Error message</span>
        </div>
        <div class="form-control">
          <label for="confirmpassword">Confirm Password</label>
          <input type="password" id="confirmpassword" placeholder="Confirm your password" autocomplete="off" />
          <i class="fa-solid fa-circle-check"></i>
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Error message</span>
        </div>
        <input type="submit" value="Submit" class="btn" />
      </form>
    </div>
  </body>
</html>
